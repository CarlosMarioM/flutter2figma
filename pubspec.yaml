name: flutter2figma
description: >-
  (Beta) Convert an existing Flutter UI into an editable Figma design:
  auto-layout frames or an exact runtime capture, text styles, color variables
  with light/dark modes, and components.
version: 0.2.0
repository: https://github.com/CarlosMarioM/flutter2figma
issue_tracker: https://github.com/CarlosMarioM/flutter2figma/issues

topics:
  - figma
  - design
  - design-system
  - cli
  - codegen

environment:
  sdk: ^3.11.0

executables:
  flutter2figma: flutter2figma

dependencies:
  analyzer: ^14.4.0
  args: ^2.6.0
  # Same version as the Flutter SDK pins (packages/flutter/pubspec.yaml), so
  # ColorScheme.fromSeed produces identical colors.
  image: ^4.10.1
  material_color_utilities: ^0.13.0
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
